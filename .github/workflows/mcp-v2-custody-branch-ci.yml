name: MCP v2 custody branch gate

on:
  push:
    branches:
      - feat/mcp-v2-custody-adapter

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devspace-tests-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        run: npm run build

      - name: Doctor
        run: node dist/cli.js doctor
